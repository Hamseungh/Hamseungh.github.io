<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202c43"><link rel="manifest" href="manifest.webmanifest"><title>Dun Story Editor Mobile</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#182337;font:15px system-ui,sans-serif}header{background:#202c43;color:white;padding:18px}header small{opacity:.7}main{max-width:680px;margin:auto;padding:15px}section{background:white;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px #15213a0d}h2{font-size:17px;margin:0 0 14px}label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}input,select,textarea{width:100%;font:inherit;padding:11px;border:1px solid #cbd2dd;border-radius:9px;background:white}textarea{resize:vertical;min-height:120px;line-height:1.6}button{border:0;border-radius:9px;padding:11px 14px;background:#e8ecf4;color:#182337;font:inherit;cursor:pointer}button.primary{background:#245ac3;color:white}button.danger{background:#fff0f0;color:#a21c27}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.actions>*{flex:1}nav{display:flex;gap:8px;margin-bottom:14px}nav button{flex:1}nav button.active{background:#245ac3;color:white}.muted{color:#637087;font-size:13px}.hidden{display:none}.entry{border:1px solid #dce1ea;border-radius:10px;padding:12px;margin:9px 0;white-space:pre-wrap}.entry button{margin-top:8px}.status{font-size:13px;color:#39624b;min-height:20px}#previewContent{white-space:pre-wrap;line-height:1.7}.file{display:none}
</style></head><body><header><small>모바일 보조 에디터</small><h2 style="margin:4px 0">Dun Story Editor</h2></header><main>
<section><h2>프로젝트 파일</h2><input type="file" id="file" accept=".json,application/json"><div class="actions"><button id="export" class="primary">JSON 내보내기</button><button id="clear" class="danger">임시 저장 초기화</button></div><p class="muted">PC 프로젝트의 모든 시트 데이터를 보존하며, 장면과 선택지만 수정합니다. 변경 내용은 이 브라우저에 임시 저장됩니다.</p><div id="status" class="status"></div></section>
<section><label>스토리</label><select id="story"></select><label>장면</label><select id="scene"></select><div class="actions"><button id="addScene">+ 장면 추가</button><button id="deleteScene" class="danger">장면 삭제</button></div></section>
<nav><button data-tab="scene" class="active">장면 작성</button><button data-tab="choices">선택지</button><button data-tab="preview">미리보기</button></nav>
<section id="pane-scene"><h2>장면 작성</h2><label>장면 ID</label><input id="sceneId" autocomplete="off"><p class="muted">ID를 변경한 뒤 입력창 밖을 누르면 연결된 참조도 함께 수정됩니다.</p><label>제목</label><input id="title"><label>본문</label><textarea id="content" rows="9"></textarea><label>장면 유형</label><select id="sceneType"><option value="normal">normal</option><option value="ending">ending</option></select><label>자동 이동 장면 ID</label><select id="nextScene"></select></section>
<section id="pane-choices" class="hidden"><h2>선택지</h2><div id="choiceList"></div><button id="addChoice" class="primary">+ 선택지 추가</button><p class="muted">선택지의 조건·효과 데이터는 그대로 보존됩니다. 선택지 삭제 시 연결된 조건·효과도 삭제되므로 주의하세요.</p></section>
<section id="pane-preview" class="hidden"><h2 id="previewTitle"></h2><div id="previewContent"></div><div id="previewChoices"></div></section>
</main><script src="app.js"></script></body></html>
